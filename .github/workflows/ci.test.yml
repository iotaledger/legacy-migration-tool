name: Test

on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  shared:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.x

      - name: Install Dependencies
        run: yarn --ignore-scripts

      - name: Test
        run: yarn test:shared
