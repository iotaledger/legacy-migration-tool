name: Type Check

on:
    pull_request:
    push:
        branches:
            - 'main'

jobs:
    check-types:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 16.4.2

            - name: Install Dependencies
              run: yarn --ignore-scripts

            - name: Check types
              run: yarn check-types
